[package]
name = "rwkv-router-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for rwkv-router (PyPI package: rwkv-router)"

# cdylib only: this crate exists to become `rwkv_router.pyd/.so`. Logic lives
# in the core crate; this layer is a thin pyo3 surface (no unit tests here —
# verification is `maturin build` + a real CPython smoke).
[lib]
name = "rwkv_router"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = "1"
rwkv-router = { path = "../..", features = ["rwkv"] }
