[package]
name = "rwkv-router-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rwkv-router local intelligent routing gateway: OpenAI/Anthropic-compatible proxy + decision API + MCP (bin: rwkv-router)"

[[bin]]
name = "rwkv-router"
path = "src/main.rs"

[dependencies]
rwkv-router = { path = "..", features = ["rwkv"] }

axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
